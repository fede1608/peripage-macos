# PeriPage A6 (203 dpi, 48 mm print head on 56/57 mm paper) as an IPP Everywhere printer.
# Loaded by ippeveprinter -a. Syntax: ipptool(5) "ATTR tag name value".

ATTR text printer-make-and-model "PeriPage A6"
ATTR text printer-info "PeriPage A6 (Bluetooth, vía PeriPrint)"
ATTR keyword printer-kind document,photo,receipt,label

ATTR keyword media-supported om_peripage-30_48x30mm,om_peripage-50_48x50mm,om_peripage-75_48x75mm,om_peripage-100_48x100mm,om_peripage-150_48x150mm,om_peripage-200_48x200mm,om_peripage-300_48x300mm,om_peripage-500_48x500mm,roll_max_48x1000mm,roll_min_48x10mm
ATTR keyword media-ready om_peripage-100_48x100mm
ATTR keyword media-default om_peripage-100_48x100mm
ATTR keyword media-type-supported stationery
ATTR keyword media-source-supported main
ATTR integer media-bottom-margin-supported 0
ATTR integer media-left-margin-supported 0
ATTR integer media-right-margin-supported 0
ATTR integer media-top-margin-supported 0

ATTR collection media-col-database
  { MEMBER collection media-size { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 3000 } MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source "main" MEMBER keyword media-type "stationery" },
  { MEMBER collection media-size { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 5000 } MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source "main" MEMBER keyword media-type "stationery" },
  { MEMBER collection media-size { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 7500 } MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source "main" MEMBER keyword media-type "stationery" },
  { MEMBER collection media-size { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 10000 } MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source "main" MEMBER keyword media-type "stationery" },
  { MEMBER collection media-size { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 15000 } MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source "main" MEMBER keyword media-type "stationery" },
  { MEMBER collection media-size { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 20000 } MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source "main" MEMBER keyword media-type "stationery" },
  { MEMBER collection media-size { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 30000 } MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source "main" MEMBER keyword media-type "stationery" },
  { MEMBER collection media-size { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 50000 } MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source "main" MEMBER keyword media-type "stationery" },
  { MEMBER collection media-size { MEMBER integer x-dimension 4800 MEMBER rangeOfInteger y-dimension 1000-100000 } MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source "main" MEMBER keyword media-type "stationery" }

# Validate-Job/Print-Job check media-col sizes against this list.
ATTR collection media-size-supported
  { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 3000 },
  { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 5000 },
  { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 7500 },
  { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 10000 },
  { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 15000 },
  { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 20000 },
  { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 30000 },
  { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 50000 },
  { MEMBER integer x-dimension 4800 MEMBER rangeOfInteger y-dimension 1000-100000 }

ATTR collection media-col-default { MEMBER collection media-size { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 10000 } MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source "main" MEMBER keyword media-type "stationery" }
ATTR collection media-col-ready { MEMBER collection media-size { MEMBER integer x-dimension 4800 MEMBER integer y-dimension 10000 } MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source "main" MEMBER keyword media-type "stationery" }
ATTR keyword media-col-supported media-size,media-bottom-margin,media-left-margin,media-right-margin,media-top-margin,media-source,media-type

ATTR keyword print-color-mode-supported monochrome
ATTR keyword print-color-mode-default monochrome
ATTR keyword output-mode-supported monochrome
ATTR keyword output-mode-default monochrome
ATTR enum print-quality-supported 4
ATTR enum print-quality-default 4
ATTR resolution printer-resolution-supported 203dpi
ATTR resolution printer-resolution-default 203dpi
# ippeveprinter -a can't take -f, so jobs arrive as PWG Raster rendered by macOS at 203 dpi.
ATTR resolution pwg-raster-document-resolution-supported 203dpi
ATTR keyword pwg-raster-document-type-supported black_1,sgray_8,srgb_8
ATTR keyword pwg-raster-document-sheet-back normal
ATTR keyword sides-supported one-sided
ATTR keyword sides-default one-sided
ATTR rangeOfInteger copies-supported 1-99
ATTR integer copies-default 1
ATTR keyword print-scaling-supported auto,fit,fill,none
ATTR keyword print-scaling-default fit
ATTR enum orientation-requested-supported 3,4
ATTR enum orientation-requested-default 3
ATTR keyword pdf-versions-supported adobe-1.3,adobe-1.4,adobe-1.5,adobe-1.6,adobe-1.7,iso-32000-1_2008
ATTR integer pages-per-minute 5
ATTR keyword which-jobs-supported completed,not-completed,all
ATTR boolean color-supported false
