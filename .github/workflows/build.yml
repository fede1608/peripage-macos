name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, build and package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PERIPRINT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PERIPRINT_VERSION=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: scripts/swift.sh test

      - name: Build PeriPrint.app and the peripage CLI
        run: scripts/build-app.sh

      - name: Build PeriPrint Driver.app
        run: driver/install.sh --build-only

      - name: Package
        run: scripts/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: PeriPrint-macOS-${{ env.PERIPRINT_VERSION }}
          path: dist/PeriPrint-macOS.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/PeriPrint-macOS.zip \
            --title "PeriPrint $GITHUB_REF_NAME" --generate-notes
